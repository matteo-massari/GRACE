[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-graph-rag"
version = "0.1.0"
description = "Graph Neural Network and Graph RAG recommendation system"
authors = [{ name = "Matteo Massari" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Graph RAG e agent
    "autogen-ext>=0.7.5",
    "langchain>=1.2.10",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.9",
    "langgraph-cli[inmem]>=0.1.54",
    "neo4j>=6.1.0",
    "neo4j-graphrag>=1.17.0",
    "neo4j-rust-ext>=6.2.0.0",
    "openai>=2.21.0",
    "openai-agents>=0.2.1",
    "pydantic>=2.13.4",
    "qdrant-client>=1.17.1",
    "tqdm>=4.68.2",

    # Data science e machine learning
    "python-dotenv>=1.2.1",
    "duckdb>=1.5.1",
    "impyla>=0.22.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.5.1",
    "networkx>=3.0",
    "pandas<3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "joblib>=1.5.3",
    "faiss-cpu>=1.13.2",

    # PyTorch e PyTorch Geometric
    "torch>=2.11.0",
    "torchvision<=0.26.0",
    "torch-geometric>=2.7.0",
    "pytorch-warmup>=0.2.0",
    "lightning-bolts>=0.7.0",
    "info-nce-pytorch>=0.1.4",

    # Notebook e documentazione
    "nbformat>=5.10.4",
    "nbconvert>=7.17.1",
    "marimo>=0.23.11",
    "playwright>=1.60.0",
    "pdoc>=16.0.0",
    "myst-parser>=5.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinxcontrib-mermaid>=2.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.12.1",
    "sphinx-rtd-theme>=3.1.0",
]



[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true