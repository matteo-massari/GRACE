# Separate project: stopping MLflow does not stop Neo4j.
name: graph-recommendation-mlflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0-full
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-1234}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mlflow_data:
