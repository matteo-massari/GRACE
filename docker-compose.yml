services:
  neo4j:
    image: neo4j:5.26.27
    container_name: neo4j_graphrag
    volumes:
      - neo4j_logs:/logs
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - neo4j_config:/config
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-Password10}
      - NEO4J_PLUGINS=["apoc","apoc-extended"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always

volumes:
  neo4j_logs:
  neo4j_data:
  neo4j_plugins:
  neo4j_config:
